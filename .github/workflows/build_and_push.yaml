name: Build and Push Multi-arch Docker Image

on:
  workflow_call:
    inputs:
      registry:
        required: true
        type: string
      image:
        required: true
        type: string
      tag:
        required: false
        type: string
        default: ${{ github.sha }}
      latest:
        required: false
        type: boolean
        default: false
      platforms:
        required: false
        type: string
        default: |
          linux/amd64
      build_args:
        required: false
        type: string
        default: ''
      context:
        required: false
        type: string
        default: '.'
      docker_file:
        required: false
        type: string
        default: 'Dockerfile'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.READ_REPOS }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set registry type
      id: registry
      run: |
        if [[ ${{ inputs.registry }} =~ ^.*-docker.pkg.dev.*$  ]]; then
            echo "type=gcp" >> $GITHUB_OUTPUT
        else
            echo "type=dockerhub" >> $GITHUB_OUTPUT
        fi

    - name: Login to GCR
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: _json_key
        password: ${{ secrets.GCR_JSON_KEY }}
      if: steps.registry.outputs.type == 'gcp'

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      if: steps.registry.outputs.type == 'dockerhub'

    - name: Set image tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ inputs.registry }}/${{ inputs.image }}
        tags: |
          type=raw,value=latest,enable=${{ inputs.latest }}
          type=raw,value=${{ inputs.tag }}

    - name: Build and push image
      id: build
      uses: docker/build-push-action@v6
      with:
        push: true
        platforms: ${{ inputs.platforms }}
        context: ${{ github.workspace }}/${{ inputs.context }}
        file: ${{ github.workspace }}/${{ inputs.context }}/${{ inputs.docker_file }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        outputs: type=image,push-by-digest=true,name-canonical=true,push=true
