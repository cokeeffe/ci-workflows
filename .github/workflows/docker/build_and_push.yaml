name: Build and Push Multi-arch Docker Image

on:
  workflow_call:
    inputs:
      registy:
        required: true
        type: string
      image:
        required: true
        type: string
      latest:
        required: false
        type: boolean
        default: false
      platforms:
        required: false
        type: string
        default: |
          linux/amd64
      build_args:
        required: false
        default: ''
      context:
        required: false
        default: '.'
      docker_file:
        required: false
        default: 'Dockerfile'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code and prepare env
      uses: .github/actions/docker/prepare/

    - name: Login to registry
      uses: .github/actions/docker/registry/
      with:
        registry: ${{ inputs.registry }}

    - name: Set image tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ inputs.image }}
        tags: |
          type=schedule
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha
          type=raw,value=latest,enable=${{ inputs.latest }}

    - name: Build and push image
      id: build
      uses: docker/build-push-action@v6
      with:
        push: true
        platforms: ${{ inputs.platforms }}
        context: ${{ inputs.context }}
        file: ${{ inputs.docker_file }}
        tags: |
          ${{ github.head_ref }}.${{ github.sha }}
          ${{ inputs.additional_tags }}
        outputs: type=image,push-by-digest=true,name-canonical=true,push=true
