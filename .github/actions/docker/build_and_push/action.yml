name: Build and Push Multi-arch Docker Image

inputs:
  registry:
    required: true
    type: string
  image:
    required: true
    type: string
  tags:
    required: false
    type: string
    default: ''
  latest:
    required: false
    type: boolean
    default: false
  platforms:
    required: false
    type: string
    default: |
      linux/amd64
  build_args:
    required: false
    type: string
    default: ''
  context:
    required: false
    type: string
    default: '.'
  docker_file:
    required: false
    type: string
    default: 'Dockerfile'
  sha_tag:
    required: false
    type: boolean
    default: true
  push:
    required: false
    type: boolean
    default: true
  cache_from:
    required: false
    type: string
    default: ""
  cache_to:
    required: false
    type: string
    default: ""
  gcp_service_account_key:
    required: false
  docker_registy_login:
    required: false
  docker_registy_password:
    required: false

runs:
  using: "composite"
  steps:
  - name: Set up QEMU
    uses: docker/setup-qemu-action@v3
    if: ${{ contains(inputs.platforms, 'linux/arm64') }}

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v3

  - name: Set git sha tag for docker image
    shell: bash
    id: sha_tag
    run: |
      cd ${{ inputs.context }}
      echo "value=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
    if: ${{ inputs.sha_tag }}

  - name: Set cache values
    shell: bash
    id: cache
    run: |
      CACHE_FROM="${{ inputs.cache_from }}"
      CACHE_TO="${{ inputs.cache_to }}"

      if [ -z "$CACHE_FROM" ]; then
        CACHE_FROM="type=registry,ref=${{ inputs.registry }}/${{ inputs.image }}:cache"
      fi

      if [ -z "$CACHE_TO" ]; then
        CACHE_TO="type=registry,ref=${{ inputs.registry }}/${{ inputs.image }}:cache,mode=max"
      fi

      echo "from=$CACHE_FROM" >> $GITHUB_OUTPUT
      echo "to=$CACHE_TO" >> $GITHUB_OUTPUT

  - name: Set image tags
    id: meta
    uses: docker/metadata-action@v5
    with:
      images: |
        ${{ inputs.registry }}/${{ inputs.image }}
      tags: |
        type=raw,value=latest,enable=${{ inputs.latest }}
        type=raw,value=${{ steps.sha_tag.outputs.value }},enable=${{ inputs.sha_tag }}
        ${{ inputs.tags }}

  - name: Build and push image
    id: build
    uses: docker/build-push-action@v6
    with:
      push: ${{ inputs.push }}
      platforms: ${{ inputs.platforms }}
      context: ${{ github.workspace }}/${{ inputs.context }}
      file: ${{ github.workspace }}/${{ inputs.context }}/${{ inputs.docker_file }}
      tags: ${{ steps.meta.outputs.tags }}
      build-args: |
        ${{ inputs.build_args }}
        ${{ contains(inputs.platforms, 'linux/arm64') && 'TARGETARCH=aarch64' || ''}}
      labels: ${{ steps.meta.outputs.labels }}
      cache-from: ${{ steps.cache.outputs.from }}
      cache-to: ${{ steps.cache.outputs.to }}
